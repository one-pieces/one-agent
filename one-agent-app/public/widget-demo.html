<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例客户网站 · one-agent 客服组件演示</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1a1d24;
        background: #f6f7f9;
      }
      header { background: #101319; color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
      header strong { font-size: 18px; }
      nav a { color: #c9ced9; text-decoration: none; margin-left: 18px; font-size: 14px; }
      .hero { padding: 64px 28px 40px; max-width: 860px; margin: 0 auto; }
      .hero h1 { font-size: 34px; margin: 0 0 12px; letter-spacing: -0.4px; }
      .hero p { color: #5b6270; font-size: 17px; margin: 0 0 24px; }
      .hero .cta { display: inline-block; background: #2f6bff; color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; max-width: 860px; margin: 0 auto 64px; padding: 0 28px; }
      .card { background: #fff; border: 1px solid #e6e8ee; border-radius: 12px; padding: 18px; }
      .card h3 { margin: 0 0 6px; font-size: 15px; }
      .card p { margin: 0; color: #6b7280; font-size: 13.5px; }
      .hint { max-width: 860px; margin: 0 auto 80px; padding: 14px 28px; color: #6b7280; font-size: 13px; }
      .hint code { background: #eceff4; padding: 2px 6px; border-radius: 5px; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <header>
      <strong>示例商城</strong>
      <nav><a href="#">首页</a><a href="#">商品</a><a href="#">帮助中心</a></nav>
    </header>

    <section class="hero">
      <h1>这是一个模拟的客户网站</h1>
      <p>右下角的按钮就是 one-agent 客服组件（由 <code>widget.js</code> 注入）。点开即可与接入的 agent 对话。</p>
      <a class="cta" href="#">随便逛逛</a>
    </section>

    <section class="cards">
      <div class="card"><h3>界面隔离</h3><p>面板内容是 iframe，本站样式不会影响对话界面。</p></div>
      <div class="card"><h3>脚本一行接入</h3><p>粘贴一段 script 标签即可，无需构建步骤。</p></div>
      <div class="card"><h3>可编程控制</h3><p>window.OneAgentChat.open() / close() / on('unread')</p></div>
    </section>

    <p class="hint" id="hint">加载中…</p>

    <script>
      // 从 URL 读取 agent / key（便于本地演示与自动化测试）：?agent=agent-xxx&key=wk_xxx
      var params = new URLSearchParams(location.search);
      var agent = params.get("agent");
      var key = params.get("key");
      var hint = document.getElementById("hint");

      if (!agent || !key) {
        hint.innerHTML = "请在 URL 上带 <code>?agent=agent-xxx&key=wk_xxx</code>（后台 agent 详情页的「客服组件」里有可复制的嵌入代码）。";
      } else {
        var s = document.createElement("script");
        s.src = "/widget.js";
        s.async = true;
        s.setAttribute("data-agent", agent);
        s.setAttribute("data-key", key);
        s.setAttribute("data-auto-open", params.get("open") === "1" ? "true" : "false");
        if (params.get("color")) s.setAttribute("data-color", params.get("color"));
        if (params.get("position")) s.setAttribute("data-position", params.get("position"));
        document.body.appendChild(s);

        window.addEventListener("message", function (e) {
          if (e.data && e.data.type === "oa:ready") {
            hint.innerHTML = "客服组件已就绪（agent <code>" + agent + "</code>）。点击右下角按钮开始对话。";
          }
        });
        window.OneAgentChatReady = true;
      }
    </script>
  </body>
</html>
